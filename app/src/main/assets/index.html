<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Launcher</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:#000;color:#f5f5f7;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px 12px 32px}
button{font:inherit;color:inherit;cursor:pointer;border:0;padding:0;background:none}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#wrap{position:relative;width:100%;max-width:1280px;overflow:hidden;border-radius:10px;border:1px solid #2a2a2c;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:#000}
#wp,#scrim,#home,.scr{position:absolute;inset:0}
#scrim{background:#000}
.hide{opacity:0;visibility:hidden}
#clock{position:absolute;left:150px;top:74px;height:84px;padding:0 40px;border-radius:42px;display:flex;align-items:center;gap:28px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 12px 30px rgba(0,0,0,.35);text-shadow:0 2px 8px rgba(0,0,0,.45)}
#ct{font-size:42px;font-weight:400;letter-spacing:1px;white-space:nowrap}
.cdv{width:1px;height:46px;background:rgba(255,255,255,.28)}
.cdw{display:flex;flex-direction:column;gap:4px;font-size:24px;line-height:1.1;color:#e5e5ea;white-space:nowrap}
.cwx{display:flex;align-items:center;gap:8px;color:#c7c7cc;font-size:22px}
#top{position:absolute;right:150px;top:80px;display:flex;gap:32px}
.tb,.tile{position:relative;transition:transform .38s cubic-bezier(.34,1.56,.64,1);will-change:transform}
.tb{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.tile{width:185px;height:116px;border-radius:28px}
.ic{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.18)}
.tb::after,.tile::after,.th::after{content:"";position:absolute;inset:-6px;border-radius:44px;border:4px solid #fff;opacity:0;transition:opacity .16s;pointer-events:none}
.tb::after{border-radius:50%}
.tl2{position:absolute;left:-26px;right:-26px;top:128px;text-align:center;font-size:26px;color:#a1a1a6;white-space:nowrap;transition:color .16s}
.tile.f .tl2{color:#fff;font-weight:600}
.tb.f{transform:scale(1.22)}
.tile.f{transform:scale(1.1) translateY(-12px)}
.f::after{opacity:1}
.ed .tile.f::after{border-style:dashed}
#lab{position:absolute;left:0;right:0;bottom:350px;text-align:center;font-size:36px;font-weight:500;letter-spacing:.4px;min-height:40px}
#dock{position:absolute;left:170px;right:170px;bottom:70px;display:flex;justify-content:space-between;gap:20px;padding:40px 48px 64px;border-radius:64px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 6px rgba(0,0,0,.4),0 44px 90px rgba(0,0,0,.6)}
#dock::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 45%);pointer-events:none}
.scr{opacity:0;visibility:hidden;transform:scale(1.05)}
.scr.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s,transform .45s cubic-bezier(.22,.8,.25,1)}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.85)}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.93)}to{opacity:1}}
.gd .tile{animation:rise .55s cubic-bezier(.22,.9,.3,1) backwards;animation-delay:calc(var(--i)*45ms)}
.panel{animation:pop .45s cubic-bezier(.22,.9,.3,1) backwards}
.row{transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}.row.f{transform:translateX(10px)}
#drawer{background:rgba(6,6,12,.5);}
#settings,#search{background:rgba(6,6,12,.5);display:flex;align-items:center;justify-content:center}
#studio{background:rgba(0,0,0,.8);}
#app{background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center}
.gd{position:absolute;left:190px;right:190px;top:240px;display:grid;grid-template-columns:repeat(5,276px);justify-content:space-between;gap:100px 0}
.gd .tile{width:276px;height:172px;border-radius:34px}.gd .tl2{top:186px}
.panel{width:900px;padding:40px 44px 36px;border-radius:52px;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 44px 90px rgba(0,0,0,.8)}
.panel h2{font-size:40px;font-weight:500;margin:0 0 24px}
.row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:24px;height:72px;padding:0 32px;margin-bottom:10px;border-radius:24px;background:rgba(255,255,255,.06);border:3px solid transparent;font-size:30px;text-align:left}
.row.f{background:rgba(255,255,255,.17);border-color:#fff}
.row>span:first-child{display:flex;align-items:center;gap:20px}
.sw{width:84px;height:48px;border-radius:24px;background:#3a3a3c;position:relative;flex:none}
.sw i{position:absolute;top:4px;left:4px;width:40px;height:40px;border-radius:50%;background:#fff;transition:transform .16s}
.row.on .sw{background:#30d158}.row.on .sw i{transform:translateX(36px)}
.v,.chev{color:#a1a1a6}.chev{font-size:30px}
.sub{font-size:30px;color:#a1a1a6;margin:0 0 20px}
.note{font-size:28px;line-height:1.4;color:#a1a1a6;margin:14px 6px 0}
.sth{position:absolute;left:0;right:0;top:70px;margin:0;text-align:center;font-size:40px;font-weight:500}
#pv{position:absolute;left:600px;top:160px;width:720px;height:405px;border-radius:28px;border:1px solid rgba(255,255,255,.2);overflow:hidden;background:#000}
#pvb,#pvs{position:absolute;inset:0}#pvs{background:#000}
#pd{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:18px;padding:18px 24px;border-radius:30px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}#pd i{width:48px;height:48px;border-radius:14px}#pk{position:absolute;left:54px;top:26px;font-size:30px;font-weight:300}#pt{position:absolute;right:54px;top:26px;display:flex;gap:14px}#pt i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2)}
.busy #pd,.busy #pk,.busy #pt{display:none}
#pm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:32px;padding:14px 28px;border-radius:20px;background:rgba(0,0,0,.65);white-space:nowrap}
#pm:empty{display:none}
#wl{position:absolute;left:0;right:0;top:590px;text-align:center;font-size:36px;font-weight:500;min-height:48px}
.stw{position:absolute;left:0;top:650px;width:1920px;height:230px}
.strip{position:absolute;left:820px;top:36px;display:flex;gap:36px;transition:transform .24s cubic-bezier(.2,.7,.2,1)}
.th{position:relative;flex:none;width:280px;height:158px;border-radius:22px;border:2px solid rgba(255,255,255,.14);transition:transform .16s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:28px;line-height:1.15;text-align:center;padding:8px;background-color:#0a0a0c}
.th::after{border-radius:28px}
.tl{border-style:dashed;background-color:rgba(255,255,255,.07)}
.th.f{transform:scale(1.1)}
.th.ac{border-color:rgba(255,255,255,.7)}
.th.ac::before{content:"Active";position:absolute;left:10px;bottom:10px;font-size:24px;padding:3px 12px;border-radius:12px;background:rgba(0,0,0,.65)}
.big2{width:200px;height:200px;border-radius:52px;display:flex;align-items:center;justify-content:center;margin-bottom:30px;border:1px solid rgba(255,255,255,.18)}
.at{font-size:40px;font-weight:500;margin:0}
.ap{font-size:32px;color:#a1a1a6;margin:18px 0 0}
.rm .scr{transform:none!important}.rm .row.f{transform:none!important}.rm,.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}.rm .tile.f,.rm .tb.f,.rm .th.f{transform:none!important}
#pad{display:grid;grid-template-columns:repeat(3,96px);gap:12px;justify-content:center}
.k{height:78px;border-radius:22px;background:#1c1c1e;font-size:26px}
.k:active{background:#3a3a3c}
.k.ok{background:#f5f5f7;color:#000;font-weight:600;font-size:22px}
.k.s{font-size:16px;color:#d1d1d6}
.info{max-width:520px;font-size:14px;line-height:1.5;color:#a1a1a6;margin:0}
.info b{color:#f5f5f7}
.info ul{margin:6px 0 0;padding-left:20px}

body.tv{padding:0;gap:0;justify-content:center;min-height:100vh;overflow:hidden}
.tv #wrap{max-width:none;border:0;border-radius:0}
.tv #pad,.tv .info{display:none}
.tv *{}
.tv #clock,.tv .tb,.tv #dock,.tv .panel,.tv #np{background:linear-gradient(180deg,var(--g1),var(--g2));box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.tv .ic{box-shadow:none}
.tv #lab,.tv .sth,.tv #wl{text-shadow:0 2px 6px rgba(0,0,0,.85)}
.tv #drawer,.tv #settings,.tv #custom,.tv #menu,.tv #dockedit,.tv #upload,.tv #search{background:rgba(8,10,20,.86)}
.tv #studio{background:rgba(0,0,0,.88)}
.tv .scr{transform:none}
.ic .bn{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.ic .ia{width:64px;height:64px;object-fit:contain;border-radius:14px}
.tl2{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);font-weight:500}
.tile.f .tl2{font-weight:700}
#drawer::before{content:"";position:absolute;left:0;right:0;top:0;height:190px;background:linear-gradient(rgba(8,10,20,.97) 55%,rgba(8,10,20,0));z-index:4;pointer-events:none}
#drawer .sth{z-index:5}
#stage{--g1:rgba(60,80,120,.5);--g2:rgba(25,35,70,.45);--ds:1;--r:28px}
#top{left:760px;right:150px;align-items:center}
.tb.wide{flex:1;width:auto;border-radius:36px;justify-content:flex-start;gap:18px;padding:0 30px;font-size:28px;color:#c7c7cc;white-space:nowrap}
.tb.wide::after{border-radius:42px}
.tb.wide.f{transform:scale(1.04)}
.tile{width:calc(185px*var(--ds));height:calc(116px*var(--ds));border-radius:var(--r)}
.tl2{top:calc(128px*var(--ds))}
.gd .tile{width:276px;height:172px;border-radius:34px}.gd .tl2{top:186px}
#settings,#custom,#menu,#dockedit,#upload,#search{background:rgba(6,6,12,.5);display:flex;align-items:center;justify-content:center}
#search{align-items:flex-start;padding-top:36px}
.row.gr{background:rgba(48,209,88,.35)}
.url{font-size:44px;font-weight:600;padding:22px 30px;border-radius:24px;background:rgba(255,255,255,.1);margin:6px 0 18px;word-break:break-all}
.panel.narrow{width:640px}
.row{height:66px;margin-bottom:8px}
.row>span:first-child{min-width:0;overflow:hidden;white-space:nowrap}
.row svg{flex:none}
.row img.bn{width:64px;height:36px;object-fit:cover;border-radius:8px;flex:none}
.row img.ia{width:40px;height:40px;object-fit:contain;border-radius:9px;flex:none}
#q{display:block;width:100%;height:76px;border-radius:38px;border:3px solid transparent;background:rgba(255,255,255,.1);color:#fff;font-size:32px;padding:0 32px;outline:0;margin-bottom:18px;font-family:inherit}
#q.f{border-color:#fff;background:rgba(255,255,255,.17)}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:16px 34px;border-radius:30px;font-size:30px;background:rgba(20,24,40,.94);border:1px solid rgba(255,255,255,.22);opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;white-space:nowrap}
#toast.on{opacity:1}
/* update 3: no blur, glide ring, smooth motion */
#stage{--r:20px;--dh:230px;--h1:rgba(60,80,120,.4);--h2:rgba(25,35,70,.36)}
#clock,.tb{background:linear-gradient(180deg,var(--h1),var(--h2))}
#dock,.panel,#np,.wcard{background:linear-gradient(180deg,var(--g1),var(--g2))}
#clock,.tb,#dock,.panel,#np,.wcard{border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.3)}
#dock::before,#np::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,0) 50%);pointer-events:none}
#dock{left:130px;right:130px;justify-content:space-evenly;gap:12px;padding:34px 40px 58px}
#lab{bottom:calc(70px + var(--dh) + 6px);font-size:24px;font-weight:500;letter-spacing:.3px;min-height:28px;opacity:.9}
.tb,.tile,.th{transition:transform .22s ease-out}
.tb.f{transform:scale(1.1)}.tb.wide.f{transform:scale(1.03)}
.tile.f,.th.f{transform:scale(1.06)}
.tb::after,.tile::after,.th::after,#np::after{display:none!important}
.ic .bn{object-fit:fill}
.tl2{color:rgba(255,255,255,.62);font-weight:500;transition:color .2s ease}
.tile.f .tl2{color:#fff;font-weight:600}
#ring{position:absolute;left:0;top:0;z-index:30;pointer-events:none;border:3px solid #fff;box-sizing:border-box;opacity:0;box-shadow:0 12px 30px rgba(255,255,255,.2),0 0 0 1px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.25,.1,.25,1),width .3s cubic-bezier(.25,.1,.25,1),height .3s cubic-bezier(.25,.1,.25,1),border-radius .2s,opacity .15s}
#ring.on{opacity:1}#ring.nt{transition:none}#ring.ed{border-style:dashed}
#wpo{position:absolute;inset:0;pointer-events:none;opacity:0}
.fi{animation:fi .35s ease both}@keyframes fi{from{opacity:0}to{opacity:1}}
#np{position:absolute;left:130px;right:130px;bottom:calc(70px + var(--dh) + 44px);display:flex;flex-direction:column;gap:10px;padding:18px 26px;border-radius:calc(var(--r) + 14px);opacity:0;visibility:hidden;transform:translateY(16px);transition:opacity .3s ease,transform .3s ease,visibility 0s .3s}
#np.on{opacity:1;visibility:visible;transform:none;transition:opacity .3s ease,transform .3s ease}
.npm{display:flex;gap:22px;align-items:center}
#npa{width:96px;height:96px;flex:none;border-radius:calc(var(--r) - 4px);background:#1d2233 center/cover no-repeat;border:1px solid rgba(255,255,255,.15)}
#npa.noart{background:linear-gradient(150deg,#2a3150,#141828)}
.npi{flex:1;min-width:0}
#npn{font-size:18px;color:#b4b4ba;letter-spacing:.2px}
#npti{font-size:30px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#npar{font-size:22px;color:#cfcfd4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npc{display:flex;gap:18px;align-items:center;flex:none}
.nb{position:relative;width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);transition:transform .2s ease-out}
.nb.f{transform:scale(1.1)}
#npx{font-size:20px;color:#e5e5ea;padding:8px 16px;border-radius:14px;background:rgba(255,255,255,.08);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
#drawer::before{height:170px}
#drawer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(rgba(8,10,20,0),rgba(8,10,20,.97) 60%);z-index:4;pointer-events:none}
.gd{transition:transform .3s cubic-bezier(.25,.1,.25,1)}
.gd .tile{animation:none;transition:transform .22s ease-out,opacity .25s ease}
.gd .tile.dm{opacity:.5}
.panel{animation:none}
.row{transition:background .15s ease,border-color .15s ease}.row.f{transform:none}
.strip{transition:transform .28s cubic-bezier(.25,.1,.25,1)}
.stw{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 6%,#000 94%,transparent 100%)}
.scr{transition:opacity .22s ease,transform .3s ease,visibility 0s .3s}
.scr.on{transition:opacity .3s ease,transform .35s ease,visibility 0s}
.tv .scr{transform:scale(.985)}.tv .scr.on{transform:none}
#home{transition:opacity .3s ease,visibility 0s}.hide{transition:opacity .25s ease,visibility 0s .25s}
#clock{background:linear-gradient(180deg,var(--h1),var(--h2))}
.cwx{border-radius:20px}
#weather{display:flex;align-items:flex-start;justify-content:center;padding-top:44px;background:rgba(0,0,0,.55)}
.wcard{width:780px;padding:34px 44px 26px;border-radius:52px;position:relative}
.wtop{display:flex;justify-content:space-between;align-items:center}
.wbig{font-size:120px;font-weight:300;line-height:1;letter-spacing:-2px}
.wcond{font-size:32px;margin-top:8px}
.wloc{display:flex;align-items:center;gap:8px;font-size:26px;color:#cfd2da;margin-top:10px}
.wdays{margin-top:22px;border-top:1px solid rgba(255,255,255,.16);padding-top:10px}
.wd{display:flex;align-items:center;gap:22px;height:62px;font-size:28px}
.wd b{width:90px;font-weight:500}.wd .i{flex:1}.wd em{font-style:normal;color:#e5e7ee}
.rm *,.rm *::before,.rm *::after{transition:none!important;animation:none!important}
.tv #clock,.tv .tb{background:linear-gradient(180deg,var(--h1),var(--h2))}
.tv #dock,.tv .panel,.tv #np,.tv .wcard{background:linear-gradient(180deg,var(--g1),var(--g2))}
.tv #clock,.tv .tb,.tv #dock,.tv .panel,.tv #np,.tv .wcard{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.07),0 14px 34px rgba(0,0,0,.3)}
.tv #weather{background:rgba(0,0,0,.55)}
#ring.dr{transition:none}
.gd{transition:none;will-change:transform}
.gd .tile,.gd .tile.f{will-change:auto;transition:none;animation:none;transform:none}
.gd .tile.dm{opacity:1}
.tv #drawer,.tv #drawer.on{transform:none;transition:opacity .2s ease,visibility 0s}
.gd{will-change:transform}
.gd .tile,.gd .tile.f{will-change:auto;transition:none;transform:none}
.gd .tile.f .tl2{transition:none}
.gd{transition:transform .42s cubic-bezier(.22,.8,.25,1)}
#ring.dr{transition:transform .42s cubic-bezier(.22,.8,.25,1),width .3s ease,height .3s ease,border-radius .2s,opacity .15s}
.gd .tile{transition:opacity .35s ease}
.hide{transition:opacity .15s ease,visibility 0s .15s}
.scr.on{transition:opacity .28s ease .07s,transform .35s ease .07s,visibility 0s}
#ring{transition:transform .22s cubic-bezier(.25,.1,.25,1),width .22s cubic-bezier(.25,.1,.25,1),height .22s cubic-bezier(.25,.1,.25,1),border-radius .2s,opacity .15s}
#ring.nt{transition:none}
.tb,.tile,.th,.nb{will-change:auto!important;transition:none!important}
.tb.f,.tb.wide.f,.tile.f,.th.f,.nb.f,.gd .tile.f{transform:none!important}
.scr,.tv .scr,.scr.on,.tv .scr.on{transform:none!important}
.tile .tl2{transition:color .18s ease!important}
.gd .tile{transition:opacity .35s ease!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<div id="wp"></div><div id="wpo"></div><div id="scrim"></div>
<div id="home"><div id="clock"><span id="ct"></span><span class="cdv"></span><span class="cdw"><span id="cdt"></span><span class="cwx"><span id="cwi"></span><span id="cwt"></span></span></span></div><div id="top"></div>
<div id="np"><div class="npm"><div id="npa"></div><div class="npi"><div id="npn"></div><div id="npti"></div><div id="npar"></div></div><div class="npc"><button class="nb" id="npb" tabindex="-1" data-k="nb" data-i="0"></button><button class="nb" id="npp" tabindex="-1" data-k="nb" data-i="1"></button><button class="nb" id="npf" tabindex="-1" data-k="nb" data-i="2"></button></div></div><div id="npx"></div></div>
<div id="lab"></div><div id="dock"></div></div>
<div id="drawer" class="scr"></div><div id="settings" class="scr"></div><div id="custom" class="scr"></div><div id="menu" class="scr"></div><div id="dockedit" class="scr"></div><div id="upload" class="scr"></div><div id="search" class="scr"></div><div id="studio" class="scr"></div><div id="weather" class="scr" data-k="wc"></div><div id="app" class="scr"></div><div id="ring"></div>
<div id="toast"></div>
</div></div>
<div id="pad">
