plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zerosad.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.zerosad.tvlauncher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
